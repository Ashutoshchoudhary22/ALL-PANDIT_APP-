<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - ApnaAcharya</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #fff8f0 0%, #ffe8cc 100%);
        color: #1f2937;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }

      .card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border-radius: 20px;
        padding: 28px 24px;
        box-shadow: 0 16px 40px rgba(124, 58, 237, 0.12);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        color: #7c3aed;
      }

      p {
        margin: 0 0 16px;
        line-height: 1.5;
        color: #4b5563;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #374151;
      }

      input {
        width: 100%;
        height: 48px;
        border: 1px solid #ffcc80;
        border-radius: 12px;
        padding: 0 14px;
        font-size: 15px;
        margin-bottom: 16px;
      }

      button {
        width: 100%;
        height: 50px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(90deg, #ffb366, #ff8c00);
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .error {
        background: #fef2f2;
        color: #dc2626;
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 16px;
        font-size: 14px;
      }

      .success {
        background: #ecfdf5;
        color: #047857;
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 16px;
        font-size: 14px;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Reset Password</h1>
      <p id="intro">Choose a new password for your ApnaAcharya account.</p>
      <div id="errorBox" class="error hidden"></div>
      <div id="successBox" class="success hidden"></div>

      <form id="resetForm">
        <label for="password">New Password</label>
        <input id="password" type="password" minlength="6" required autocomplete="new-password" />

        <label for="confirmPassword">Confirm Password</label>
        <input
          id="confirmPassword"
          type="password"
          minlength="6"
          required
          autocomplete="new-password"
        />

        <button id="submitBtn" type="submit">Update Password</button>
      </form>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const form = document.getElementById('resetForm');
      const errorBox = document.getElementById('errorBox');
      const successBox = document.getElementById('successBox');
      const submitBtn = document.getElementById('submitBtn');
      const intro = document.getElementById('intro');

      function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.remove('hidden');
        successBox.classList.add('hidden');
      }

      function showSuccess(message) {
        successBox.textContent = message;
        successBox.classList.remove('hidden');
        errorBox.classList.add('hidden');
      }

      if (!token) {
        form.classList.add('hidden');
        intro.textContent = 'This reset link is invalid or missing a token.';
        showError('Please request a new password reset link from the app.');
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.classList.add('hidden');

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password.length < 6) {
          showError('Password must be at least 6 characters.');
          return;
        }

        if (password !== confirmPassword) {
          showError('Passwords do not match.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating...';

        try {
          const response = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password }),
          });

          const data = await response.json();

          if (!response.ok || !data.success) {
            throw new Error(data.message || 'Unable to reset password.');
          }

          form.classList.add('hidden');
          intro.textContent = 'Your password has been updated successfully.';
          showSuccess('You can now open the app and sign in with your new password.');
        } catch (error) {
          showError(error.message || 'Something went wrong. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
        }
      });
    </script>
  </body>
</html>
